name: in_app_purchase
description: A Flutter plugin for in-app purchases. Exposes APIs for making in-app purchases through the App Store and Google Play.
repository: https://github.com/yellowclass/in_app_purchase
version: 3.3.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: in_app_purchase_android
      ios:
        default_package: in_app_purchase_storekit
      macos:
        default_package: in_app_purchase_storekit

dependencies:
  flutter:
    sdk: flutter
  in_app_purchase_android: ^0.5.0
  in_app_purchase_platform_interface: ^1.4.0
  in_app_purchase_storekit:
    git:
      url: https://github.com/yellowclass/in_app_purchase_storekit
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  test: ^1.16.0

topics:
  - in-app-purchase
  - payment

screenshots:
  - description: 'Example of in-app purchase on ios'
    path: doc/iap_ios.gif
  - description: 'Example of in-app purchase on android'
    path: doc/iap_android.gif
